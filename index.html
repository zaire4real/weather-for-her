<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b9cbea" />
  <meta name="description" content="一個只為妳準備的私人天氣頁。" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_TW" />
  <meta property="og:title" content="妳那邊的天氣" />
  <meta property="og:description" content="不管妳在哪，我都想知道妳那裡冷不冷。" />
  <link rel="canonical" href="https://zaire4real.github.io/weather-for-her/" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23edf1fb'/%3E%3Cpath d='M32 47S14 37 14 24.5C14 17 23 13 32 22c9-9 18-5 18 2.5C50 37 32 47 32 47Z' fill='none' stroke='%236d75ad' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>妳那邊的天氣</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #273247;
      --muted: #657086;
      --quiet: #7e8798;
      --glass: rgba(255, 255, 255, 0.52);
      --glass-strong: rgba(255, 255, 255, 0.7);
      --line: rgba(255, 255, 255, 0.7);
      --shadow: 0 24px 70px rgba(54, 73, 107, 0.16);
      --accent: #6d75ad;
      --accent-dark: #515a91;
      --safe-bottom: max(24px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC",
        "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 225, 230, 0.9), transparent 34%),
        radial-gradient(circle at 86% 28%, rgba(206, 223, 249, 0.95), transparent 38%),
        linear-gradient(145deg, #f7edf0 0%, #dce6f5 52%, #c6d6ed 100%);
      background-attachment: fixed;
      transition: background 900ms ease, color 500ms ease;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 48vw;
      height: 48vw;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.5;
      pointer-events: none;
    }

    body::before {
      top: -20vw;
      right: -12vw;
      background: rgba(255, 255, 255, 0.75);
    }

    body::after {
      bottom: -24vw;
      left: -12vw;
      background: rgba(214, 188, 213, 0.3);
    }

    body[data-scene="clear-day"] {
      background:
        radial-gradient(circle at 82% 4%, rgba(255, 238, 169, 0.95), transparent 26%),
        radial-gradient(circle at 10% 15%, rgba(255, 228, 232, 0.75), transparent 32%),
        linear-gradient(155deg, #e8f1ff 0%, #cfe4fa 47%, #a9c8ee 100%);
    }

    body[data-scene="rain"] {
      background:
        radial-gradient(circle at 12% 12%, rgba(225, 230, 243, 0.75), transparent 34%),
        linear-gradient(155deg, #dce4ee 0%, #aebfd4 48%, #879db8 100%);
    }

    body[data-scene="cloud"] {
      background:
        radial-gradient(circle at 20% 8%, rgba(255, 239, 235, 0.78), transparent 32%),
        linear-gradient(155deg, #e8e9ef 0%, #ccd6e2 48%, #afc0d4 100%);
    }

    body[data-scene="night"] {
      --ink: #f3f5fc;
      --muted: #d3d8e8;
      --quiet: #b8c0d6;
      --glass: rgba(24, 31, 60, 0.46);
      --glass-strong: rgba(28, 36, 66, 0.68);
      --line: rgba(255, 255, 255, 0.18);
      --shadow: 0 24px 70px rgba(9, 15, 37, 0.28);
      --accent: #d6d9ff;
      --accent-dark: #f0eaff;
      background:
        radial-gradient(circle at 78% 7%, rgba(245, 234, 190, 0.2), transparent 18%),
        radial-gradient(circle at 9% 45%, rgba(96, 85, 155, 0.45), transparent 34%),
        linear-gradient(160deg, #283354 0%, #18233f 52%, #11192f 100%);
    }

    button { font: inherit; }

    .page-shell {
      width: min(100%, 1040px);
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 18px var(--safe-bottom);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 42px;
      margin-bottom: 38px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: 0.08em;
    }

    .brand-mark {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--glass);
      box-shadow: 0 8px 28px rgba(55, 65, 100, 0.1);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .privacy-note {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .language-switcher {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--glass);
      box-shadow: 0 8px 24px rgba(55, 65, 100, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .language-button {
      min-width: 36px;
      height: 28px;
      padding: 0 8px;
      border: 0;
      border-radius: 9px;
      color: var(--quiet);
      background: transparent;
      font-size: 11px;
      font-weight: 680;
      cursor: pointer;
      transition: color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .language-button:hover { color: var(--ink); }

    .language-button.is-active {
      color: var(--ink);
      background: var(--glass-strong);
      box-shadow: 0 3px 10px rgba(55, 65, 100, 0.1);
    }

    .language-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .intro {
      display: grid;
      min-height: calc(100svh - 135px);
      place-items: center;
      text-align: center;
    }

    .intro-inner {
      width: min(100%, 680px);
      padding-bottom: 12vh;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 12vw, 88px);
      font-weight: 720;
      letter-spacing: -0.065em;
      line-height: 0.98;
    }

    html[lang="en"] h1 {
      font-size: clamp(44px, 10vw, 78px);
      letter-spacing: -0.055em;
    }

    .subtitle {
      width: min(100%, 530px);
      margin: 24px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 4vw, 22px);
      font-weight: 430;
      letter-spacing: 0.015em;
      line-height: 1.75;
    }

    .locate-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 56px;
      margin-top: 40px;
      padding: 0 26px;
      border: 1px solid rgba(255, 255, 255, 0.66);
      border-radius: 18px;
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: linear-gradient(145deg, #727caf, #57638f);
      box-shadow: 0 14px 30px rgba(75, 86, 137, 0.25), inset 0 1px rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
    }

    .locate-button:hover { transform: translateY(-2px); box-shadow: 0 18px 36px rgba(75, 86, 137, 0.3); }
    .locate-button:active { transform: translateY(0); }
    .locate-button:focus-visible { outline: 3px solid rgba(91, 104, 157, 0.3); outline-offset: 4px; }
    .locate-button:disabled { opacity: 0.72; cursor: wait; transform: none; }

    .button-icon { width: 19px; height: 19px; }

    .consent-copy {
      margin: 16px auto 0;
      color: var(--quiet);
      font-size: 12px;
      line-height: 1.6;
    }

    .status {
      display: none;
      width: min(100%, 520px);
      margin: 20px auto 0;
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--muted);
      background: var(--glass);
      font-size: 13px;
      line-height: 1.55;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .status.is-visible { display: block; animation: fade-in 280ms ease both; }
    .status.is-error { color: #8d4652; background: rgba(255, 242, 243, 0.72); border-color: rgba(177, 103, 116, 0.2); }

    .weather-view { display: none; padding-bottom: 40px; }
    .weather-view.is-visible { display: block; animation: rise-in 650ms cubic-bezier(.2,.8,.2,1) both; }

    .weather-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(260px, .75fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .glass-card {
      border: 1px solid var(--line);
      background: var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(26px) saturate(1.2);
      -webkit-backdrop-filter: blur(26px) saturate(1.2);
    }

    .main-card {
      position: relative;
      min-height: 430px;
      padding: clamp(28px, 5vw, 48px);
      border-radius: 36px;
      overflow: hidden;
    }

    .main-card::after {
      content: "";
      position: absolute;
      right: -80px;
      bottom: -100px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      filter: blur(3px);
      pointer-events: none;
    }

    .location-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 620;
    }

    .location-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7c87bd;
      box-shadow: 0 0 0 5px rgba(124, 135, 189, 0.14);
    }

    .temperature-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-top: 28px;
    }

    .temperature {
      margin-left: -6px;
      font-size: clamp(92px, 19vw, 154px);
      font-weight: 240;
      letter-spacing: -0.09em;
      line-height: 0.84;
    }

    .degree { font-size: 0.43em; vertical-align: top; letter-spacing: 0; }

    .weather-symbol {
      display: grid;
      width: 82px;
      height: 82px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.24);
      font-size: 43px;
      box-shadow: 0 12px 30px rgba(64, 76, 108, 0.08);
    }

    .condition {
      margin: 24px 0 0;
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    .today-range {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .love-note {
      position: absolute;
      right: clamp(28px, 5vw, 48px);
      bottom: clamp(28px, 5vw, 42px);
      left: clamp(28px, 5vw, 48px);
      z-index: 1;
      margin: 0;
      padding-top: 19px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: ui-serif, "Songti TC", "Noto Serif TC", serif;
      font-size: 16px;
      line-height: 1.7;
    }

    .metrics-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      padding: 1px;
      border-radius: 36px;
      overflow: hidden;
    }

    .metric {
      min-height: 142px;
      padding: 24px 20px;
      background: var(--glass-strong);
    }

    .metric:nth-child(1) { border-radius: 35px 0 0; }
    .metric:nth-child(2) { border-radius: 0 35px 0 0; }
    .metric:nth-child(3) { border-radius: 0 0 0 35px; }
    .metric:nth-child(4) { border-radius: 0 0 35px; }

    .metric-label {
      display: block;
      color: var(--quiet);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.07em;
    }

    .metric-value {
      display: block;
      margin-top: 16px;
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 570;
      letter-spacing: -0.035em;
    }

    .forecast-card {
      padding: 26px 20px 20px;
      border-radius: 32px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 8px 18px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 720;
      letter-spacing: 0.06em;
    }

    .updated-at { color: var(--quiet); font-size: 12px; }

    .forecast-list { display: grid; gap: 3px; }

    .forecast-row {
      display: grid;
      grid-template-columns: minmax(72px, .8fr) 42px minmax(92px, 1fr) 76px;
      align-items: center;
      min-height: 64px;
      padding: 0 12px;
      border-radius: 18px;
      color: var(--muted);
    }

    .forecast-row + .forecast-row { border-top: 1px solid rgba(255, 255, 255, 0.32); }
    .forecast-row:first-child { color: var(--ink); background: rgba(255, 255, 255, 0.22); }
    .forecast-day { color: var(--ink); font-weight: 650; }
    .forecast-icon { font-size: 24px; }
    .forecast-rain { font-size: 12px; }
    .forecast-temp { justify-self: end; color: var(--ink); font-variant-numeric: tabular-nums; }
    .forecast-low { color: var(--quiet); }

    .weather-actions {
      display: flex;
      justify-content: center;
      padding: 22px 0 6px;
    }

    .refresh-button {
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--muted);
      background: var(--glass);
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .refresh-button:hover { color: var(--ink); background: var(--glass-strong); }

    footer {
      padding: 38px 0 12px;
      color: var(--quiet);
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .signature {
      display: block;
      margin-top: 7px;
      color: var(--ink);
      font-family: ui-serif, Georgia, serif;
      font-size: 18px;
      font-style: italic;
      letter-spacing: 0.16em;
    }

    .loading-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.42);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 720px) {
      .page-shell { padding-right: 14px; padding-left: 14px; }
      .topbar { margin-bottom: 16px; }
      .privacy-note span { display: none; }
      .top-actions { gap: 8px; }
      .intro-inner { padding-bottom: 16vh; }
      .weather-hero { grid-template-columns: 1fr; }
      .main-card { min-height: 420px; border-radius: 30px; }
      .metrics-card { border-radius: 30px; }
      .metric:nth-child(1) { border-radius: 29px 0 0; }
      .metric:nth-child(2) { border-radius: 0 29px 0 0; }
      .metric:nth-child(3) { border-radius: 0 0 0 29px; }
      .metric:nth-child(4) { border-radius: 0 0 29px; }
      .forecast-card { border-radius: 28px; padding-right: 12px; padding-left: 12px; }
      .forecast-row { grid-template-columns: 60px 36px minmax(74px, 1fr) 68px; padding: 0 9px; }
    }

    @media (max-width: 390px) {
      .brand { gap: 7px; font-size: 11px; }
      .brand-mark { width: 30px; height: 30px; }
      .privacy-note { display: none; }
      .language-button { min-width: 33px; padding: 0 6px; }
      .temperature { font-size: 88px; }
      .weather-symbol { width: 68px; height: 68px; border-radius: 22px; font-size: 36px; }
      .metric { min-height: 124px; padding: 20px 16px; }
      .forecast-row { grid-template-columns: 54px 32px minmax(64px, 1fr) 62px; font-size: 13px; }
      .forecast-rain { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <div class="brand" id="brand" aria-label="妳那邊的天氣">
        <span class="brand-mark" aria-hidden="true">♡</span>
        <span>WEATHER FOR HER</span>
      </div>
      <div class="top-actions">
        <div class="privacy-note" id="privacyNote" title="位置只用於查詢天氣，不會儲存">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 22s7-3.5 7-10V5l-7-3-7 3v7c0 6.5 7 10 7 10Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="m9.5 12 1.7 1.7 3.5-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="privacyText">不會儲存妳的位置</span>
        </div>
        <div class="language-switcher" id="languageSwitcher" role="group" aria-label="選擇語言">
          <button class="language-button" type="button" data-language="zh-TW" aria-pressed="true">繁</button>
          <button class="language-button" type="button" data-language="zh-CN" aria-pressed="false">简</button>
          <button class="language-button" type="button" data-language="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <section class="intro" id="intro" aria-labelledby="page-title">
      <div class="intro-inner">
        <p class="eyebrow" id="eyebrow">Just for you ♡</p>
        <h1 id="page-title">妳那邊的天氣</h1>
        <p class="subtitle" id="subtitle">不管妳在哪，我都想知道妳那裡冷不冷。</p>

        <button class="locate-button" id="locateButton" type="button">
          <svg class="button-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="9" r="2.4" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <span>查看我現在的天氣</span>
        </button>
        <p class="consent-copy"><span id="consentPrimary">點一下才會詢問定位權限</span><br><span id="consentSecondary">座標只用來查詢當下的天氣</span></p>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section class="weather-view" id="weatherView" aria-label="妳現在的天氣">
      <div class="weather-hero">
        <article class="glass-card main-card">
          <p class="location-line"><span class="location-dot" aria-hidden="true"></span><span id="locationName">妳現在的位置</span></p>
          <div class="temperature-row">
            <div class="temperature"><span id="currentTemp">--</span><span class="degree">°</span></div>
            <div class="weather-symbol" id="weatherSymbol" aria-hidden="true">☁️</div>
          </div>
          <p class="condition" id="condition">正在看看天空⋯⋯</p>
          <p class="today-range" id="todayRange">今日 --° — --°</p>
          <p class="love-note" id="loveNote">「想提醒妳天氣，也想提醒妳：今天要好好照顧自己。」</p>
        </article>

        <article class="glass-card metrics-card" id="metricsCard" aria-label="目前天氣詳細資料">
          <div class="metric">
            <span class="metric-label" id="feelsLikeLabel">體感溫度</span>
            <span class="metric-value" id="feelsLike">--°</span>
          </div>
          <div class="metric">
            <span class="metric-label" id="humidityLabel">濕度</span>
            <span class="metric-value" id="humidity">--%</span>
          </div>
          <div class="metric">
            <span class="metric-label" id="rainChanceLabel">降雨機率</span>
            <span class="metric-value" id="rainChance">--%</span>
          </div>
          <div class="metric">
            <span class="metric-label" id="windSpeedLabel">風速</span>
            <span class="metric-value" id="windSpeed">-- <small>km/h</small></span>
          </div>
        </article>
      </div>

      <article class="glass-card forecast-card">
        <div class="section-heading">
          <h2 id="forecastTitle">未來 7 天</h2>
          <span class="updated-at" id="updatedAt"></span>
        </div>
        <div class="forecast-list" id="forecastList"></div>
      </article>

      <div class="weather-actions">
        <button class="refresh-button" id="refreshButton" type="button">重新取得我的位置</button>
      </div>
    </section>

    <footer>
      MADE WITH CARE FOR YOU
      <span class="signature">— LYC</span>
    </footer>
  </main>

  <script>
    const els = {
      intro: document.getElementById('intro'),
      weatherView: document.getElementById('weatherView'),
      locateButton: document.getElementById('locateButton'),
      refreshButton: document.getElementById('refreshButton'),
      status: document.getElementById('status'),
      brand: document.getElementById('brand'),
      privacyNote: document.getElementById('privacyNote'),
      privacyText: document.getElementById('privacyText'),
      languageSwitcher: document.getElementById('languageSwitcher'),

      if (!window.isSecureContext && location.protocol !== 'file:') {
        return 'secureOnly';

      if (!error) return 'locationUnavailable';
      if (error.code === 1) return 'permissionDenied';
      if (error.code === 2) return 'positionUnavailable';
      if (error.code === 3) return 'positionTimeout';
      return 'locationUnavailable';
    }

    function findNearestHourlyIndex(times, currentTime) {
      if (!Array.isArray(times) || !times.length) return -1;
      const target = new Date(currentTime).getTime();
      let bestIndex = 0;
      let smallestGap = Infinity;
      times.forEach((time, index) => {
        const gap = Math.abs(new Date(time).getTime() - target);
        if (gap < smallestGap) {
          smallestGap = gap;
          bestIndex = index;
        }
      });
      return bestIndex;
    }

      return new Intl.DateTimeFormat(locale, { weekday: 'short' }).format(new Date(`${dateString}T12:00:00`));

      if (rainChance >= 50 || (code >= 51 && code <= 99)) return t('rainNote');
      if (temp <= 14) return t('coldNote');
      if (temp >= 31) return t('hotNote');
      if (code <= 2) return t('clearNote');
      return t('defaultNote');

    async function fetchJson(url, timeout = 12000) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function localDateKey(isoTime) {
      const date = new Date(isoTime);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function metSymbolToWmo(symbol = '') {
      const name = symbol.replace(/_(day|night|polartwilight)$/, '');
      if (name.includes('thunder')) return 95;
      if (name.includes('heavyrain')) return 65;
      if (name.includes('rainshowers')) return 80;
      if (name.includes('lightrain')) return 61;
      if (name.includes('rain')) return 63;
      if (name.includes('heavysnow')) return 75;
      if (name.includes('lightsnow')) return 71;
      if (name.includes('snow')) return 73;
      if (name.includes('sleet')) return 67;
      if (name.includes('fog')) return 45;
      if (name.includes('partlycloudy')) return 2;
      if (name.includes('cloudy')) return 3;
      if (name.includes('fair')) return 1;
      return 0;
    }

    function metRainChance(interval, code) {
      const details = interval?.details || {};
      if (Number.isFinite(details.probability_of_precipitation)) {
        return details.probability_of_precipitation;
      }
      const amount = Number(details.precipitation_amount) || 0;
      if (amount > 0) return Math.min(95, Math.round(40 + amount * 12));
      if (code >= 95) return 80;
      if (code >= 51) return 60;
      return 0;
    }

    function estimateApparentTemperature(temperature, humidity, windKmh) {
      const vaporPressure = (humidity / 100) * 6.105 * Math.exp((17.27 * temperature) / (237.7 + temperature));
      return temperature + 0.33 * vaporPressure - 0.7 * (windKmh / 3.6) - 4;
    }

    function normalizeMetWeather(payload) {
      const timeseries = payload?.properties?.timeseries;
      if (!Array.isArray(timeseries) || !timeseries.length) throw new Error('MET Norway returned incomplete data');

      const rows = timeseries.map((item) => {
        const details = item.data?.instant?.details || {};
        const interval = item.data?.next_1_hours || item.data?.next_6_hours || item.data?.next_12_hours || {};
        const code = metSymbolToWmo(interval.summary?.symbol_code);
        return {
          time: item.time,
          temperature: Number(details.air_temperature),
          humidity: Number(details.relative_humidity),
          windKmh: Number(details.wind_speed) * 3.6,
          code,
          rainChance: metRainChance(interval, code)
        };
      }).filter((row) => Number.isFinite(row.temperature));

      const severity = { 0: 0, 1: 5, 2: 10, 3: 20, 45: 30, 61: 45, 63: 55, 65: 70, 67: 60, 71: 45, 73: 55, 75: 70, 80: 60, 95: 90 };
      const dayGroups = new Map();
      rows.forEach((row) => {
        const key = localDateKey(row.time);
        if (!dayGroups.has(key)) {
          dayGroups.set(key, { date: key, temperatures: [], rainChance: 0, code: row.code });
        }
        const group = dayGroups.get(key);
        group.temperatures.push(row.temperature);
        group.rainChance = Math.max(group.rainChance, row.rainChance);
        if ((severity[row.code] || 0) > (severity[group.code] || 0)) group.code = row.code;
      });

      const days = [...dayGroups.values()].slice(0, 7);
      if (days.length < 7) throw new Error('MET Norway returned fewer than 7 forecast days');

      const now = rows[0];
      const localHour = new Date().getHours();
      return {
        source: 'met-norway',
        current: {
          time: now.time,
          temperature_2m: now.temperature,
          apparent_temperature: estimateApparentTemperature(now.temperature, now.humidity, now.windKmh),
          relative_humidity_2m: now.humidity,
          precipitation: 0,
          weather_code: now.code,
          wind_speed_10m: now.windKmh,
          is_day: localHour >= 6 && localHour < 18 ? 1 : 0
        },
        hourly: {
          time: rows.map((row) => row.time),
          precipitation_probability: rows.map((row) => row.rainChance)
        },
        daily: {
          time: days.map((day) => day.date),
          weather_code: days.map((day) => day.code),
          temperature_2m_max: days.map((day) => Math.max(...day.temperatures)),
          temperature_2m_min: days.map((day) => Math.min(...day.temperatures)),
          precipitation_probability_max: days.map((day) => day.rainChance)
        }
      };
    }

    async function fetchOpenMeteo(latitude, longitude) {
      const params = new URLSearchParams({
        latitude: String(latitude),
        longitude: String(longitude),
        current: 'temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,is_day',
        hourly: 'precipitation_probability',
        daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',
        timezone: 'auto',
        forecast_days: '7'
      });
      const data = await fetchJson(`https://api.open-meteo.com/v1/forecast?${params}`);
      if (!data.current || !data.daily) throw new Error('Incomplete weather data');
      data.source = 'open-meteo';
      return data;
    }

    async function fetchWeather(latitude, longitude) {
      let primaryError;
      for (const delay of [0, 700, 1600]) {
        if (delay) await wait(delay);
        try {
          return await fetchOpenMeteo(latitude, longitude);
        } catch (error) {
          primaryError = error;
          console.warn('Open-Meteo request failed; retrying if possible.', error);
        }
      }

      showStatus('switchingSource');
      try {
        const metParams = new URLSearchParams({ lat: latitude.toFixed(4), lon: longitude.toFixed(4) });
        const payload = await fetchJson(`https://api.met.no/weatherapi/locationforecast/2.0/compact?${metParams}`);
        return normalizeMetWeather(payload);
      } catch (fallbackError) {
        throw new AggregateError([primaryError, fallbackError], 'All weather providers failed');
      }
    }

    function renderWeather(data, latitude, longitude, shouldScroll = true) {
      const current = data.current;
      const daily = data.daily;
      const info = weatherInfo(current.weather_code);
      const hourlyIndex = findNearestHourlyIndex(data.hourly?.time, current.time);
      const rainChance = hourlyIndex >= 0 ? data.hourly.precipitation_probability[hourlyIndex] : daily.precipitation_probability_max[0];
      const isNight = current.is_day === 0;

      lastWeather = { data, latitude, longitude };
      setLoading(false);
      showStatus('');
      document.body.dataset.scene = isNight ? 'night' : info.scene;
      els.locationName.textContent = `${t('locationName')} · ${latitude.toFixed(2)}°, ${longitude.toFixed(2)}°`;
      els.currentTemp.textContent = rounded(current.temperature_2m);
      els.weatherSymbol.textContent = isNight && current.weather_code <= 1 ? '🌙' : info.icon;
      els.condition.textContent = info.label;
      els.todayRange.textContent = t('todayRange', { low: rounded(daily.temperature_2m_min[0]), high: rounded(daily.temperature_2m_max[0]) });
      els.feelsLike.textContent = `${rounded(current.apparent_temperature)}°`;
      els.humidity.textContent = `${rounded(current.relative_humidity_2m)}%`;
      els.rainChance.textContent = `${rounded(rainChance, 0)}%`;
      els.windSpeed.innerHTML = `${rounded(current.wind_speed_10m)} <small>km/h</small>`;
      els.loveNote.textContent = getLoveNote(data, Number(rainChance) || 0);

      els.forecastList.innerHTML = daily.time.map((date, index) => {
        const dayInfo = weatherInfo(daily.weather_code[index]);
        const rain = rounded(daily.precipitation_probability_max[index], 0);
        return `
          <div class="forecast-row">
            <span class="forecast-day">${dayLabel(date, index)}</span>
            <span class="forecast-icon" aria-label="${dayInfo.label}" title="${dayInfo.label}">${dayInfo.icon}</span>
            <span class="forecast-rain">💧 ${rain}%</span>
            <span class="forecast-temp"><span class="forecast-low">${rounded(daily.temperature_2m_min[index])}°</span> / ${rounded(daily.temperature_2m_max[index])}°</span>
          </div>`;
      }).join('');

      const updated = new Date();
      const time = `${updated.getHours().toString().padStart(2, '0')}:${updated.getMinutes().toString().padStart(2, '0')}`;
      const sourceNote = data.source === 'met-norway' ? t('fallbackSource') : '';
      els.updatedAt.textContent = `${t('updated', { time })}${sourceNote}`;
      els.intro.style.display = 'none';
      els.weatherView.classList.add('is-visible');
      if (shouldScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function requestWeather() {
      hasAttemptedLocation = true;
      showStatus('');
      setLoading(true);

      if (!('geolocation' in navigator)) {
        setLoading(false);
        showStatus('unsupported', 'error');
        return;
      }

      navigator.geolocation.getCurrentPosition(async (position) => {
        const { latitude, longitude } = position.coords;
        showStatus('found');
        try {
          const data = await fetchWeather(latitude, longitude);
          renderWeather(data, latitude, longitude);
        } catch (error) {
          console.error(error);
          setLoading(false);
          showStatus('weatherUnavailable', 'error');
        }
      }, (error) => {
        setLoading(false);
        showStatus(friendlyGeoErrorKey(error), 'error');
      }, {
        enableHighAccuracy: false,
        timeout: 12000,
        maximumAge: 5 * 60 * 1000
      });
    }

    els.locateButton.addEventListener('click', requestWeather);
    els.refreshButton.addEventListener('click', () => {
      els.weatherView.classList.remove('is-visible');
      els.intro.style.display = 'grid';
      requestWeather();
    });
    els.languageButtons.forEach((button) => {
      button.addEventListener('click', () => setLanguage(button.dataset.language));
    });
    setLanguage(detectInitialLanguage(), false);
  </script>
</body>
</html>
